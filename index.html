<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUTYVO — Connect. Share. Discover.</title>
  <link rel="stylesheet" href="style.css">
</head><body class="auth-body">  <main class="auth-container">
    <section class="auth-card">  <div class="auth-brand">
    <h1>BUTYVO</h1>
    <p>Connect. Share. Discover.</p>
  </div>

  <div class="auth-tabs">
    <button id="loginTab" class="auth-tab active" type="button">
      Log in
    </button>

    <button id="signupTab" class="auth-tab" type="button">
      Sign up
    </button>
  </div>

  <!-- LOGIN -->
  <form id="loginForm" class="auth-form">
    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" placeholder="Enter your password" required>

    <button type="submit" class="auth-submit">
      Log in
    </button>
  </form>

  <!-- SIGN UP -->
  <form id="signupForm" class="auth-form hidden">
    <label>Full name</label>
    <input type="text" placeholder="Enter your full name" required>

    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Password</label>
    <input type="password" placeholder="Create a password" minlength="6" required>

    <button type="submit" class="auth-submit">
      Create account
    </button>
  </form>

</section>

  </main>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="app.js"></script></body>
</html>
